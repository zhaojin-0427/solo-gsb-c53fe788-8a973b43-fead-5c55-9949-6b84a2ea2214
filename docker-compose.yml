services:
  zip-recovery:
    build: .
    image: zip-recovery:latest
    container_name: zip-recovery
    ports:
      - "8000:8000"
    environment:
      # 256 MiB upload limit, 1 GiB cumulative expansion limit
      ZIPRECOVER_MAX_UPLOAD_BYTES: "268435456"
      ZIPRECOVER_MAX_EXPAND_BYTES: "1073741824"
      ZIPRECOVER_DATA_DIR: /data
    volumes:
      - recovery-data:/data
    # the service must run within 512 MiB of memory
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  recovery-data:
